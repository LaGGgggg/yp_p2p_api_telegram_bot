version: "3.9"

services:

  postgres:
    image: postgres:latest
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    expose:
      - 5432

  bot:
    depends_on:
      - postgres
    build:
      context: .
    restart: always
    volumes:
      - logs:/code/logs
    expose:
      - 8080:8080
    entrypoint: ["/bin/sh", "entrypoint.sh"]

volumes:
  postgres_data:
  logs:
